name: Pult release

# Pult's own release (xaxis pult/tasks/release-feed.task), beside upstream's
# disabled workflows. An annotated tag `pult-v<x.y.z>` on main builds Pult.app
# for macOS arm64, signed with the Developer ID and notarized, with the update
# feed naming this repository; checks the feed, the version and the signature;
# launches the app from its dmg (apps/pult/desktop/scripts/smoke.ts); and only
# then publishes the GitHub Release the installed app updates from. A dispatch
# builds the dispatched commit as a dry run, or, with `publish`, the existing
# tag for its version.

on:
  push:
    tags: ["pult-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Pult's version, x.y.z (or its tag, pult-vx.y.z)"
        required: true
        type: string
      publish:
        description: Publish a GitHub Release from the existing tag pult-v<version>
        required: false
        default: false
        type: boolean
      signed:
        description: Sign with the Developer ID and notarize (needs the five secrets)
        required: false
        default: true
        type: boolean
      runner:
        description: The macOS runner label, when macos-26 has no capacity (an Intel one, e.g. macos-15-intel, for arch x64)
        required: false
        default: macos-26
        type: string
      arch:
        description: The app's arch; x64 only for a dry run on an Intel runner, since releases are arm64
        required: false
        default: arm64
        type: choice
        options: [arm64, x64]

permissions:
  contents: read

concurrency:
  group: pult-release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Pult.app (macOS ${{ inputs.arch || 'arm64' }})
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      # A tag run is always signed and publishes; an unsigned build never
      # publishes, since Squirrel.Mac refuses an update signed by another identity.
      - name: Resolve the version
        id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_SIGNED: ${{ inputs.signed }}
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == push ]]; then
            tag="$GITHUB_REF_NAME" publish=true signed=true arch=arm64
          else
            tag="pult-v${INPUT_VERSION#pult-v}" publish="$INPUT_PUBLISH" signed="$INPUT_SIGNED" arch="${INPUT_ARCH:-arm64}"
          fi
          version="${tag#pult-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$tag is not pult-v<major>.<minor>.<patch>." >&2
            exit 1
          fi
          if [[ "$publish" == true && "$signed" != true ]]; then
            echo "::error::An unsigned build never publishes; dispatch with signed or without publish." >&2
            exit 1
          fi
          if [[ "$publish" == true && "$arch" != arm64 ]]; then
            echo "::error::Releases are arm64 only; an x64 build is a dry run." >&2
            exit 1
          fi
          # Publishing builds the tag; a dry run builds the dispatched commit.
          ref="$GITHUB_SHA"
          if [[ "$publish" == true ]]; then ref="refs/tags/$tag"; fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "publish=$publish"
            echo "signed=$signed"
            echo "arch=$arch"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
          echo "Pult $version $arch from $ref (signed: $signed, publish: $publish)."

      - name: Check the signing secrets
        if: steps.resolve.outputs.signed == 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::A signed build needs the repository secrets ${missing[*]}. Set them, or dispatch with signed off for a dry run." >&2
            exit 1
          fi

      # Upstream's checkout, without actions/checkout: its credential cleanup
      # fails on the orphaned gitlinks in the vendored .repos tree.
      - name: Checkout
        id: checkout
        shell: bash
        env:
          RUNNER_KIND: ${{ runner.environment }}
          REF: ${{ steps.resolve.outputs.ref }}
          TAG: ${{ steps.resolve.outputs.tag }}
          PUBLISH: ${{ steps.resolve.outputs.publish }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          # Pult's own runner keeps its workspace between jobs: the last build's release/ would publish beside this one's.
          [[ "$PWD" == "$GITHUB_WORKSPACE" ]] || { echo "::error::Not in the workspace: $PWD." >&2; exit 1; }
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          # setup-ci-deps restores and saves the pnpm store where pnpm keeps it, on the own runner the user's own.
          if [[ "$RUNNER_KIND" == self-hosted ]]; then
            # The own runner keeps the store and pnpm's metadata between jobs in its tool cache (<runner>/_work/_tool),
            # outside RUNNER_TEMP, which it empties, and the workspace; once kept, no job downloads or saves the cache.
            [[ -n "${RUNNER_TOOL_CACHE:-}" ]] || { echo "::error::The runner names no RUNNER_TOOL_CACHE to keep the pnpm store in." >&2; exit 1; }
            kept="$RUNNER_TOOL_CACHE/pult-pnpm"
            echo "kept-dir=$kept" >> "$GITHUB_OUTPUT"
            # Kept once an install into it has finished, so a canceled first restore downloads the cache again.
            if [[ -f "$kept/installed" ]]; then echo "kept-store=true" >> "$GITHUB_OUTPUT"; fi
            echo "pnpm_config_store_dir=$kept/store" >> "$GITHUB_ENV"
            echo "pnpm_config_cache_dir=$kept/metadata" >> "$GITHUB_ENV"
          else
            echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
          fi
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          if [[ "$PUBLISH" == true ]]; then
            git fetch --no-tags --depth=1 origin "+$REF:$REF"
            # The release's notes are the tag's annotation.
            if [[ "$(git cat-file -t "$REF")" != tag ]]; then
              echo "::error::$TAG is a lightweight tag; cut an annotated one (git tag -a)." >&2
              exit 1
            fi
          else
            git fetch --no-tags --depth=1 origin "$REF"
          fi
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout -q --detach FETCH_HEAD
          git log -1 --format='Building %H (%s)'

      - name: Setup dependencies
        if: steps.checkout.outputs.kept-store != 'true'
        uses: ./.github/actions/setup-ci-deps

      # A store the own runner kept has the cache's packages already, and pnpm fetches only what the lockfile added.
      - name: Setup Vite+
        if: steps.checkout.outputs.kept-store == 'true'
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Install dependencies into the kept store
        if: steps.checkout.outputs.kept-store == 'true'
        shell: bash
        run: vp install

      - name: Mark the pnpm store kept
        if: steps.checkout.outputs.kept-dir != ''
        shell: bash
        env:
          KEPT: ${{ steps.checkout.outputs.kept-dir }}
        run: touch "$KEPT/installed"

      # A signed build puts the signing identity in a keychain of electron-builder's own on the user's
      # search list, and its bundled root certificates in another it never takes off; on Pult's own
      # runner that list is Anton's (xaxis pult/tasks/release-on-own-runner.task). Noted here, so the
      # build's additions come off after it, however it ends.
      - name: Note the keychain search list
        if: steps.resolve.outputs.signed == 'true'
        shell: bash
        run: security list-keychains -d user | sed -E 's/^[[:space:]]*"(.*)"$/\1/' > "$RUNNER_TEMP/keychains-before"

      - name: Build Pult.app
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          SIGNED: ${{ steps.resolve.outputs.signed }}
          ARCH: ${{ steps.resolve.outputs.arch }}
          CSC_LINK: ${{ steps.resolve.outputs.signed == 'true' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ steps.resolve.outputs.signed == 'true' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ steps.resolve.outputs.signed == 'true' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ steps.resolve.outputs.signed == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ steps.resolve.outputs.signed == 'true' && secrets.APPLE_API_ISSUER || '' }}
          # The signing keychain goes in the job's temporary folder, which the runner empties, not the user's.
          APP_BUILDER_TMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          unset ELECTRON_RUN_AS_NODE
          args=(--platform mac --target dmg --arch "$ARCH" --app-version "$VERSION" --feed --verbose)
          if [[ "$SIGNED" == true ]]; then
            # electron-builder's notarization takes the App Store Connect key as a path to its .p8.
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            export APPLE_API_KEY="$key_path"
            args+=(--signed)
          fi
          node apps/pult/desktop/scripts/package.ts "${args[@]}"
          ls -l release

      - name: Take the build's keychains off the search list
        if: always() && steps.resolve.outputs.signed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/keychains-before"
          [[ -f "$before" ]] || exit 0
          keep=() added=()
          # Only electron-builder's own: its signing keychain, here in RUNNER_TEMP, and its root certificates'.
          while IFS= read -r keychain; do
            if ! grep -qxF -- "$keychain" "$before" &&
              [[ "$keychain" == "$RUNNER_TEMP"/* || "$keychain" == */electron-builder-root-certs.keychain ]]; then
              added+=("$keychain")
            else
              keep+=("$keychain")
            fi
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"(.*)"$/\1/')
          (( ${#added[@]} > 0 )) || exit 0
          if (( ${#keep[@]} == 0 )); then
            echo "::error::The keychain search list holds only the build's: ${added[*]}. Set it back by hand." >&2
            exit 1
          fi
          security list-keychains -d user -s "${keep[@]}"
          for keychain in "${added[@]}"; do
            echo "Took $keychain off the search list."
            if [[ "$keychain" == "$RUNNER_TEMP"/* ]]; then security delete-keychain "$keychain" || true; fi
          done

      - name: Check the bundle
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          SIGNED: ${{ steps.resolve.outputs.signed }}
          ARCH: ${{ steps.resolve.outputs.arch }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          for asset in "Pult-$VERSION-$ARCH.dmg" "Pult-$VERSION-$ARCH.zip" \
            "Pult-$VERSION-$ARCH.dmg.blockmap" "Pult-$VERSION-$ARCH.zip.blockmap" latest-mac.yml; do
            [[ -f "release/$asset" ]] || fail "release/$asset is missing."
          done
          grep -qx "version: $VERSION" release/latest-mac.yml || fail "latest-mac.yml is not version $VERSION."

          mount="$RUNNER_TEMP/pult-check-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "release/Pult-$VERSION-$ARCH.dmg" >/dev/null
          # The own runner is a Mac in use: a mount the checks still hold is retried, and one left behind fails the step.
          detach() {
            for _ in 1 2 3 4 5; do hdiutil detach "$mount" -force >/dev/null 2>&1 && return 0; sleep 2; done
            echo "::error::Could not detach $mount; detach it by hand." >&2
            return 1
          }
          trap 'detach || exit 1' EXIT
          app="$mount/Pult.app"
          [[ -d "$app" ]] || fail "The dmg holds no Pult.app."

          # The feed must name this fork, never upstream (pult/decisions, `update-feed`).
          feed="$app/Contents/Resources/app-update.yml"
          [[ -f "$feed" ]] || fail "Pult.app has no app-update.yml."
          cat "$feed"
          grep -qx "owner: ashakirzianov" "$feed" || fail "app-update.yml does not name owner ashakirzianov."
          grep -qx "repo: pult" "$feed" || fail "app-update.yml does not name repo pult."

          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          [[ "$bundle_version" == "$VERSION" ]] || fail "Pult.app is version $bundle_version, not $VERSION."

          if [[ "$SIGNED" == true ]]; then
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl -a -t exec -vv "$app"
            xcrun stapler validate "$app"
          else
            echo "Unsigned dry run: signature, Gatekeeper and stapling not checked."
          fi
          echo "Pult.app $VERSION names the feed ashakirzianov/pult."

      - name: Smoke test
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          ARCH: ${{ steps.resolve.outputs.arch }}
        run: |
          unset ELECTRON_RUN_AS_NODE
          node apps/pult/desktop/scripts/smoke.ts --dmg "release/Pult-$VERSION-$ARCH.dmg" \
            --artifacts-dir "$RUNNER_TEMP/pult-smoke"

      - name: Upload the smoke test's output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pult-smoke
          path: ${{ runner.temp }}/pult-smoke
          if-no-files-found: ignore

      - name: Upload the release assets
        if: steps.resolve.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pult-release
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  release:
    name: Publish the GitHub Release
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pult-release
          path: release

      # gh reads --notes-from-tag from the local repository, so the tag is fetched first, and
      # it refuses --notes-from-tag beside -R: it finds the repository from the origin remote.
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          gh release create "$TAG" --verify-tag \
            --title "Pult $VERSION" --notes-from-tag --latest \
            release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml
